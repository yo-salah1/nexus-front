<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - AI Voice Assistant</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="icon" type="image/png" href="../assets/NEXUS_ICON_CROPPED.png">
    <script src="../js/config.js"></script>
</head>
<body>
    <canvas id="nexusParticles" class="global-particles"></canvas>
    <div class="page-wrapper">
        <!-- Sign Up / Sign In Button (Top Right) -->
        <div class="auth-container">
            <a href="ai_assistant.html">
            <button class="auth-btn" id="authBtn">
                <i data-lucide="user-circle" class="auth-icon"></i>
                <span class="auth-text">Sign Up / Sign In</span>
            </button>
            </a>
        </div>
        
        <div class="main-container">
            <!-- Logo Section -->
            <div class="logo-section">
                <a href="../index.html"><img src="../assets/NEXUS_logo.png" alt="NEXUS" class="logo"></a>
            </div>
            
            <!-- Subtitle -->
            <p class="page-subtitle">
                Talk or video call. I'll understand your mood.
            </p>
            
            <!-- Voice Orb -->
            <div class="voice-orb-container">
                <div class="orb-wrapper" id="voiceOrb">
                    <div class="orb-glow"></div>
                    <div class="orb-inner">
                        <div class="orb-wave wave-1"></div>
                        <div class="orb-wave wave-2"></div>
                        <div class="orb-wave wave-3"></div>
                        <canvas id="waveformCanvas" class="waveform-canvas"></canvas>
                    </div>
                </div>
                <p class="orb-status" id="orbStatus">Ready to listen...</p>
            </div>
            
            <!-- Main Action Buttons -->
            <div class="action-buttons">
                <a href="ai_chat.html" class="action-btn" id="textChatBtn">
                    <i data-lucide="message-square" class="btn-icon"></i>
                    <div class="btn-content">
                        <span class="btn-title">Text Chat</span>
                        <span class="btn-subtitle">Text only</span>
                    </div>
                </a>
                <a href="premium_voice.html" class="action-btn" id="voiceChatBtn">
                    <i data-lucide="phone" class="btn-icon"></i>
                    <div class="btn-content">
                        <span class="btn-title">Voice Call</span>
                        <span class="btn-subtitle">Voice only</span>
                    </div>
                </a>
                <a href="video_chat.html" class="action-btn" id="videoChatBtn">
                    <i data-lucide="video" class="btn-icon"></i>
                    <div class="btn-content">
                        <span class="btn-title">Video Call</span>
                        <span class="btn-subtitle">Video only</span>
                    </div>
                </a>
                <a href="mer.html" class="action-btn" id="merBtn">
                    <i data-lucide="layers" class="btn-icon"></i>
                    <div class="btn-content">
                        <span class="btn-title">Multimodal</span>
                        <span class="btn-subtitle">Face+Voice+Text</span>
                    </div>
                </a>
            </div>
            
            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <a href="chat_history.html" class="nav-btn" id="historyBtn">
                    <i data-lucide="clock" class="nav-icon"></i>
                    <span class="nav-text">History</span>
                </a>
                <a href="settings.html" class="nav-btn" id="settingsBtn">
                    <i data-lucide="settings" class="nav-icon"></i>
                    <span class="nav-text">Settings</span>
                </a>
                <a href="dashboard.html" class="nav-btn" id="promptsBtn">
                    <i data-lucide="target" class="nav-icon"></i>
                    <span class="nav-text">Prompts</span>
                </a>
                <a href="help_support.html" class="nav-btn" id="helpBtn">
                    <i data-lucide="help-circle" class="nav-icon"></i>
                    <span class="nav-text">Help</span>
                </a>
            </div>
        </div>
        
        <!-- Floating Particles -->
        <canvas id="particleCanvas" class="particle-canvas"></canvas>
    </div>

    <!-- Custom Script -->
    <script src="../js/home.js"></script>
    <script src="../js/global.js"></script>
</body>
</html>
