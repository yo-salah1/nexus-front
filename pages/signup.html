<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Sign Up</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="icon" type="image/png" href="../assets/NEXUS_ICON_CROPPED.png">
    <script src="../js/config.js"></script>
</head>
<body>
    <canvas id="nexusParticles" class="global-particles"></canvas>
    <div class="page-wrapper">
        <div class="signup-container">
            <!-- Logo Section -->
            <div class="logo-section">
                
                <a href="../index.html"><img src="../assets/NEXUS_logo.png" alt="NEXUS" class="logo"></a>
            </div>
            
            <!-- Icon/Avatar -->
            <div class="icon-section">
                <div class="icon-wrapper">
                    
                    <img src="../assets/page1icon(1).png" alt="Icon" class="main-icon">
                </div>
            </div>
            
            <!-- Heading -->
            <h1 class="page-title">Sign up</h1>
            
            <!-- Subtitle -->
            <p class="page-subtitle">
                You'll use this password to log in to ChatGPT and<br class="desktop-only">
                other OpenAI products
            </p>
            
            <!-- Sign Up Form -->
            <form class="signup-form" id="signupForm">
                <!-- Email Input -->
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="emailInput" 
                        class="form-input" 
                        placeholder="your gamil@gmail.com"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <!-- Password Input -->
                <div class="input-wrapper password-wrapper">
                    <input 
                        type="password" 
                        id="passwordInput" 
                        class="form-input password-input" 
                        placeholder="password"
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <i data-lucide="eye-off" class="eye-icon"></i>
                    </button>
                </div>
                
                <!-- Password Strength Indicator -->
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-text" id="strengthText"></span>
                </div>
                
                <!-- Continue Button -->
                 <a href="ai_chat.html"></a>
                <button type="submit" class="btn btn-primary" id="continueBtn">
                    <span class="btn-text">Continue</span>
                    <div class="btn-ripple"></div>
                </button>
                </a>
            </form>
            
            <!-- Decorative Elements -->
            <div class="bg-decoration decoration-1"></div>
            <div class="bg-decoration decoration-2"></div>
            <div class="bg-decoration decoration-3"></div>
        </div>
        
        <!-- Floating Particles -->
        <canvas id="particleCanvas" class="particle-canvas"></canvas>
    </div>

    <!-- Custom Script -->
    <script src="../js/signup.js"></script>
    <script src="../js/global.js"></script>
</body>
</html>
