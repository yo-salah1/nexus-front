<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - AI Assistant</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ai_assistant.css">
    <link rel="icon" type="image/png" href="../assets/NEXUS_ICON_CROPPED.png">
    <script src="../js/config.js"></script>
</head>
<body>
    <canvas id="nexusParticles" class="global-particles"></canvas>
    <div class="page-container">
        <!-- Main Content -->
        <div class="content-wrapper">
            <!-- Logo Section -->
            <div class="logo-container">
               
                <a href="../index.html"><img src="../assets/NEXUS_logo.png" alt="NEXUS Logo" class="logo-image" ></a>
            </div>
            
            <!-- Badge -->
            <div class="badge-container">
                <div class="badge">
                    <i data-lucide="sparkles" class="badge-icon"></i>
                    <span class="badge-text">Assistant 1.0</span>
                </div>
            </div>
            
            <!-- Heading -->
            <h1 class="main-heading">
                Let's Solve With AI<br>Assistant.
            </h1>
            
            <!-- Subheading -->
            <p class="sub-heading">
                Discover endless ways our AI can help<br>to solving your problem instant!
            </p>
            
            <!-- Buttons Container -->
            <div class="buttons-container">
                <!-- Log In Button -->
                 <a href="login.html" class="">

                <button class="btn btn-primary" id="loginBtn">
                    <span class="btn-text">Log In</span>
                    <div class="btn-shine"></div>
                </button>
                 </a>
                <!-- Sign Up Button --> 
                 <a href="signup.html" class="">

                <button class="btn btn-secondary" id="signupBtn">
                    <span class="btn-text">Sign Up</span>
                    <div class="btn-border"></div>
                </button>
                </a>
            </div>
            
            <!-- Decorative Elements -->
            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>
            <div class="decoration decoration-3"></div>
        </div>
        
        <!-- Floating particles -->
        <div class="particles-container" id="particlesContainer"></div>
    </div>

    <!-- Custom Script -->
    <script src="../js/ai_assistant.js"></script>
    <script src="../js/global.js"></script>
</body>
</html>
