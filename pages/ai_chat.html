<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - AI Chat</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ai_chat.css">
    <link rel="icon" type="image/png" href="../assets/NEXUS_ICON_CROPPED.png">
    <script src="../js/config.js"></script>
</head>

<body>
    <canvas id="nexusParticles" class="global-particles"></canvas>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar"></aside>














        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <button class="mobile-sidebar-toggle" id="mobileSidebarToggle">
                    <i data-lucide="menu"></i>
                </button>
                <!-- Logo Section -->
                <div class="logo-section">
                    <!-- Replace 'nexus-logo.png' with your actual logo filename -->
                    <a href="../index.html"><img src="../assets/NEXUS_logo.png" alt="NEXUS" class="logo"></a>
                </div>

                <!-- Global Controls (Theme & Lang) -->
                <div class="status-lamps" style="margin-left: auto; margin-right: 1.5rem;">
                    <div class="lamp-item" id="lampTER">
                        <span class="lamp-dot"></span>
                        <span class="lamp-label">TER Model Status</span>
                    </div>
                    <div class="lamp-item" id="lampLLM">
                        <span class="lamp-dot"></span>
                        <span class="lamp-label">LLM Gateway</span>
                    </div>
                </div>

                <div class="u-ctrl-wrap">
                    <button class="u-ctrl-btn danger" id="exitBtn" title="End Session" onclick="window.location.href='home.html'">
                        <i data-lucide="phone-off"></i>
                    </button>
                    <div class="u-ctrl-label">End</div>
                </div>

            </header>

            <!-- Chat Container -->
            <div class="chat-container" id="chatContainer">
                <!-- Chat Messages Area -->
                <div class="messages-area" id="messagesArea">
                    <!-- Welcome Screen -->
                    <div class="welcome-screen" id="welcomeScreen">
                        <!-- AI Avatar -->
                        <div class="ai-avatar-container">
                            <div class="ai-avatar">
                                <!-- Replace 'ai-avatar.png' with your actual AI avatar filename -->
                                <img src="../assets/avatar.png" alt="AI Assistant" class="avatar-image">
                                <div class="avatar-glow"></div>
                            </div>
                        </div>

                        <!-- Welcome Message -->
                        <div class="welcome-message">
                            <h1 class="welcome-title">How can I help you?</h1>
                        </div>
                    </div>

                    <!-- Chat Messages (will be populated dynamically) -->
                    <div class="chat-messages" id="chatMessages">

                        <!-- Messages will be added here -->
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <input type="text" class="chat-input" id="chatInput" placeholder="How can I do about that ....."
                        autocomplete="off">
                    <button class="send-btn" id="sendBtn">
                        <i data-lucide="send" class="send-icon"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Script -->
    <script src="../js/ai_chat.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/sidebar.js"></script>
</body>

</html>
