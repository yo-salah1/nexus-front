<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - AI Help & Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/help_support.css">
    <link rel="icon" type="image/png" href="../assets/NEXUS_ICON_CROPPED.png">
    <script src="../js/config.js"></script>
</head>
<body>
    <canvas id="nexusParticles" class="global-particles"></canvas>
<div class="app-container">

    <!-- ============================================================
         SIDEBAR — exact copy from page 8
         ============================================================ -->
          <aside class="sidebar" id="sidebar"></aside>

    <!-- ============================================================
         MAIN — AI Help & Support
         ============================================================ -->
    <main class="main-content">
        <!-- Page title -->
        <header class="help-header">
                <button class="mobile-sidebar-toggle" id="mobileSidebarToggle"><i data-lucide="menu"></i></button>
            <h1 class="help-title">AI Help & Support</h1>
        </header>

        <!-- Scrollable body -->
        <div class="help-body">

            <!-- Smart FAQs -->
            <section class="help-section">
                <div class="section-heading">
                    <i data-lucide="help-circle" class="section-icon"></i>
                    <h2 class="section-title">Smart FAQs</h2>
                    <span class="section-badge">AI Suggested</span>
                </div>

                <div class="faq-list" id="faqList">
                    <!-- FAQ items injected by JS -->
                </div>
            </section>

            <!-- AI Chat Support -->
            <section class="help-section">
                <div class="section-heading">
                    <i data-lucide="message-circle" class="section-icon-chat"></i>
                    <h2 class="section-title">AI Chat Support</h2>
                </div>

                <div class="chat-widget">
                    <div class="chat-widget-header">
                        <span>Always ready to help you</span>
                    </div>
                    <div class="chat-preview">
                        <div class="chat-bubble">
                            <i data-lucide="bot" class="chat-bot-icon"></i>
                            <span class="chat-bubble-text">Hi! I'm your AI assistant. How can I help you today?</span>
                        </div>
                        <div class="typing-indicator">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <span class="typing-text">AI is typing...</span>
                        </div>
                    </div>
                    <a href="ai_chat.html">
                    <button class="chat-start-btn" id="chatStartBtn">
                        <i data-lucide="message-circle" class="btn-icon"></i>
                        <span>Start Chat with AI</span>
                    </button>
                    </a>
                </div>
            </section>

            <!-- Send Feedback -->
            <section class="help-section">
                <div class="section-heading">
                    <i data-lucide="send" class="section-icon-feedback"></i>
                    <h2 class="section-title">Send Feedback</h2>
                </div>

                <div class="feedback-widget">
                    <p class="feedback-desc">Help us improve our AI by sharing your thoughts and suggestions</p>
                    <textarea 
                        class="feedback-textarea" 
                        id="feedbackTextarea"
                        placeholder="Tell us what you think about our AI assistant..."
                        rows="5"
                    ></textarea>
                    <button class="feedback-submit-btn" id="feedbackSubmitBtn">
                        <i data-lucide="send" class="btn-icon"></i>
                        <span>Submit Feedback</span>
                    </button>
                </div>
            </section>

        </div>
    </main>
</div>

<script src="../js/help_support.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/sidebar.js"></script>
</body>
</html>
