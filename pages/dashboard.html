<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Home</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" type="image/png" href="../assets/NEXUS_ICON_CROPPED.png">
    <script src="../js/config.js"></script>
</head>
<body>
    <canvas id="nexusParticles" class="global-particles"></canvas>
<div class="app-container">

    <!-- =====================================================
         SIDEBAR — 
         ===================================================== -->
        <aside class="sidebar" id="sidebar"></aside>

    <!-- =====================================================
         MAIN — Home / Prompt Library
         ===================================================== -->
    <main class="main-content">
            <button class="mobile-sidebar-toggle" id="mobileSidebarToggle"><i data-lucide="menu"></i></button>

        <!-- Centered logo -->
        <header class="home-header">
            <a href="../index.html"><img src="../assets/NEXUS_logo.png" alt="NEXUS" class="logo"></a>
        </header>

        <!-- Scrollable body: grid + CTA -->
        <div class="home-body">

            <!-- 3×2 prompt card grid (populated by script13.js) -->
            <section class="prompt-grid" id="promptGrid"></section>

            <!-- Create New Session CTA -->
             <a href="home.html">
            <button class="cta-btn" id="ctaBtn">
                <span>Create New Session</span>
                <i data-lucide="sparkles" class="cta-icon"></i>
            </button>
            </a>
        </div>
    </main>
</div>

<script src="../js/dashboard.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/sidebar.js"></script>
</body>
</html>
